<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Product Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <h1>Product Price Calculator</h1>

    <!-- Product name input -->
    <label>
      Product Name:
      <input type="text" id="productName" placeholder="e.g., Notebook" />
    </label>

    <!-- Quantity input -->
    <label>
      Quantity:
      <input type="number" id="quantity" value="1" min="1" />
    </label>

    <!-- Price input -->
    <label>
      Price per Unit (₹):
      <input type="number" id="price" value="0" min="0" step="0.01" />
    </label>

    <!-- Result display -->
    <h2 id="result">Total: ₹0.00</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
