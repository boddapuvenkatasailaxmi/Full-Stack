<!DOCTYPE html>
<html>
<head>
  <title>My Styled Webpage</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }
    canvas {
      border: 2px solid #333;
      background: white;
    }
  </style>
</head>
<body>
  <h2>HTML 5 Canvas</h2>
  <h3>Rectangle | circle | straightline | Name as text</h3>

  <canvas id="myCanvas" width="600" height="300"></canvas>

  <script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');

    // Rectangle
    ctx.fillStyle = '#3498db';
    ctx.fillRect(30, 30, 160, 100);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 1;
    ctx.strokeRect(30, 30, 160, 100);

    // Circle
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(310, 80, 60, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(310, 80, 60, 0, Math.PI * 2);
    ctx.stroke();

    // Line
    ctx.beginPath();
    ctx.moveTo(430, 30);
    ctx.lineTo(570, 150);
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Name
    ctx.fillStyle = '#8e44ad';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Sai Laxmi', 300, 220);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Task2_partB.html</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    header {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    nav {
      background: #2c3e50;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 5px 15px;
      border-radius: 5px;
    }

    nav ul li a:hover {
      background: #3498db;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #ecf0f1;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #3498db;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .card h3 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
      margin-bottom: 12px;
    }

    .btn {
      padding: 8px 20px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #e74c3c;
    }

    footer {
      background: #2c3e50;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Styled Web Page</h1>
    </header>

    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <div class="cards">
      <div class="card">
        <h3>HTML</h3>
        <p>HTML Structures Web Pages</p>
        <button class="btn">Read More</button>
      </div>
      <div class="card" style="border-left-color: #e74c3c;">
        <h3>CSS</h3>
        <p>CSS Styles Web Page</p>
        <button class="btn">Read More</button>
      </div>
      <div class="card" style="border-left-color: #27ae60;">
        <h3>JavaScript</h3>
        <p>JavaScript adds interactivity</p>
        <button class="btn">Read More</button>
      </div>
    </div>

    <footer>
      <p>Copyright 2026</p>
    </footer>
  </div>
</body>
</html>
